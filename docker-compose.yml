services:
  postgres:
    image: postgres:15-alpine
    container_name: bitrix_inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitrix_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitrix_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrix_network

  redis:
    image: redis:7-alpine
    container_name: bitrix_inventory_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrix_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitrix_inventory_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bitrix_inventory
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-please-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@system.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      BITRIX_ENCRYPTION_KEY: ${BITRIX_ENCRYPTION_KEY:-default-encryption-key-change}
      MAX_FILE_SIZE_MB: 10
      BITRIX_CONCURRENCY: 5
      BITRIX_MAX_RETRIES: 3
      BITRIX_REQUEST_TIMEOUT: 30000
      BATCH_SIZE: 50
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - bitrix_network
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitrix_inventory_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - bitrix_network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  bitrix_network:
    driver: bridge
